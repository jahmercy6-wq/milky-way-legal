<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>MILKY WAY — Service Provider Profile</title>
  <style>
    :root {
      --bg: #070B1E;
      --card: #121936;
      --border: #263464;
      --text: #F1F5F9;
      --muted: #B8C4E0;
      --cyan: #38BDF8;
      --gold: #F5C451;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 20% 10%, #17234D 0%, var(--bg) 55%);
      color: var(--text);
      margin: 0;
      min-height: 100vh;
      padding: 28px 18px 48px;
      line-height: 1.6;
    }
    main {
      max-width: 680px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 18px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .brand-name {
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--gold);
      font-size: 0.95rem;
      text-decoration: none;
    }
    .brand-sub {
      color: var(--muted);
      font-size: 0.85rem;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 1.75rem;
      line-height: 1.25;
      color: #FFFFFF;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0 18px;
    }
    .chip {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      background: #1B2752;
      border: 1px solid #30417D;
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 600;
    }
    .chip.verified {
      border-color: var(--cyan);
      color: var(--cyan);
    }
    .desc {
      color: var(--muted);
      white-space: pre-wrap;
      margin: 0 0 20px;
    }
    .meta {
      margin: 0 0 22px;
      padding: 14px 16px;
      border-radius: 14px;
      background: #0D132B;
      border: 1px solid var(--border);
      font-size: 0.94rem;
      color: var(--muted);
    }
    .meta div + div { margin-top: 6px; }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      border: 1px solid #354784;
      background: #1B2752;
      color: var(--cyan);
    }
    .btn.primary {
      background: var(--cyan);
      border-color: var(--cyan);
      color: #061024;
    }
    .status {
      color: var(--muted);
      padding: 16px 0;
    }
    footer {
      max-width: 680px;
      margin: 18px auto 0;
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
    }
    footer a { color: var(--cyan); text-decoration: none; margin: 0 8px; }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <a class="brand-name" href="index.html">MILKY WAY</a>
      <span class="brand-sub">The Universe of Services</span>
    </div>
    <div id="content" class="status">Loading provider profile…</div>
  </main>
  <footer>
    <a href="index.html">Support</a>
    <a href="privacy.html">Privacy</a>
    <a href="terms.html">Terms</a>
  </footer>

  <script>
    (function () {
      const SUPABASE_URL = "https://hnflywnfylorzzcudebm.supabase.co";
      const PUBLISHABLE_KEY = "sb_publishable_fgiG-K1tfdiXsTkh_Zc4hQ_txHTkrhv";
      const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
      const root = document.getElementById("content");

      function setMessage(title, message) {
        root.textContent = "";
        const h1 = document.createElement("h1");
        h1.textContent = title;
        const p = document.createElement("p");
        p.className = "desc";
        p.textContent = message;
        root.appendChild(h1);
        root.appendChild(p);
      }

      function normalizePhone(raw) {
        if (typeof raw !== "string") return null;
        const compact = raw.trim().replace(/[\s\u00A0\-\u2013\u2014().]+/g, "");
        return /^\+[1-9][0-9]{6,14}$/.test(compact) ? compact : null;
      }

      function modeLabel(mode) {
        if (mode === "fixed") return "In-shop";
        if (mode === "mobile") return "Mobile service";
        if (mode === "remote") return "Remote / Online";
        return mode || "";
      }

      function addAction(container, label, href, primary) {
        const a = document.createElement("a");
        a.className = primary ? "btn primary" : "btn";
        a.textContent = label;
        a.href = href;
        if (href.startsWith("https://")) {
          a.target = "_blank";
          a.rel = "noopener noreferrer";
        }
        container.appendChild(a);
      }

      const params = new URLSearchParams(window.location.search);
      const id = (params.get("id") || "").trim();
      if (!UUID_RE.test(id)) {
        setMessage(
          "Provider profile not found",
          "This MILKY WAY profile link is missing a valid provider identifier."
        );
        return;
      }

      const url = SUPABASE_URL + "/rest/v1/public_providers?id=eq." + encodeURIComponent(id) + "&limit=1";
      fetch(url, {
        headers: {
          apikey: PUBLISHABLE_KEY,
          Accept: "application/json"
        }
      })
        .then(function (res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.json();
        })
        .then(function (rows) {
          if (!Array.isArray(rows) || rows.length === 0) {
            setMessage(
              "Provider unavailable",
              "This listing is not currently published on MILKY WAY."
            );
            return;
          }
          const p = rows[0];
          document.title = (p.name || "Provider") + " — MILKY WAY";
          root.textContent = "";

          const h1 = document.createElement("h1");
          h1.textContent = p.name || "MILKY WAY Provider";
          root.appendChild(h1);

          const chips = document.createElement("div");
          chips.className = "chips";

          const modeChip = document.createElement("span");
          modeChip.className = "chip";
          modeChip.textContent = modeLabel(p.mode);
          chips.appendChild(modeChip);

          if (p.verified_at) {
            const verifiedChip = document.createElement("span");
            verifiedChip.className = "chip verified";
            verifiedChip.textContent = "Verified on MILKY WAY";
            chips.appendChild(verifiedChip);
          }

          if (Array.isArray(p.languages) && p.languages.length > 0) {
            const langChip = document.createElement("span");
            langChip.className = "chip";
            langChip.textContent = p.languages.join(" · ").toUpperCase();
            chips.appendChild(langChip);
          }
          root.appendChild(chips);

          if (p.description) {
            const desc = document.createElement("p");
            desc.className = "desc";
            desc.textContent = p.description;
            root.appendChild(desc);
          }

          const metaLines = [];
          const placeParts = [p.city, p.country_code].filter(Boolean);
          if (placeParts.length) metaLines.push("Location: " + placeParts.join(", "));
          if (p.mode === "fixed" && p.address) metaLines.push("Address: " + p.address);
          if (p.mode === "mobile" && p.service_radius_km) {
            metaLines.push("Service radius: " + p.service_radius_km + " km");
          }
          if (p.mode === "mobile" && Array.isArray(p.coverage_cities) && p.coverage_cities.length) {
            metaLines.push("Coverage areas: " + p.coverage_cities.join(", "));
          }
          if (p.mode === "remote" && Array.isArray(p.coverage_countries) && p.coverage_countries.length) {
            metaLines.push("Serves countries: " + p.coverage_countries.join(", "));
          }
          if (metaLines.length) {
            const meta = document.createElement("div");
            meta.className = "meta";
            metaLines.forEach(function (line) {
              const div = document.createElement("div");
              div.textContent = line;
              meta.appendChild(div);
            });
            root.appendChild(meta);
          }

          const actions = document.createElement("div");
          actions.className = "actions";
          const phone = normalizePhone(p.phone);
          const whatsapp = normalizePhone(p.whatsapp);
          if (phone) addAction(actions, "Call", "tel:" + phone, true);
          if (whatsapp) {
            addAction(actions, "WhatsApp", "https://wa.me/" + whatsapp.slice(1), !phone);
          }
          if (p.mode === "fixed" && typeof p.latitude === "number" && typeof p.longitude === "number") {
            addAction(
              actions,
              "Directions",
              "https://www.google.com/maps/dir/?api=1&destination=" +
                encodeURIComponent(p.latitude + "," + p.longitude),
              false
            );
          }
          if (actions.children.length > 0) {
            root.appendChild(actions);
          }
        })
        .catch(function () {
          setMessage(
            "Unable to load profile",
            "Could not reach the MILKY WAY directory right now. Please try again shortly."
          );
        });
    })();
  </script>
</body>
</html>
